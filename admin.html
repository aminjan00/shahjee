<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Shah Jee Laptops Supplier</title>
    <meta name="description" content="Secure administrative login for inventory management, stock updates, and product catalog control.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Global CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animation.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ==========================================
         PAGE SPECIFIC STYLES (SELF-CONTAINED)
    ========================================== -->
    <style>
        body {
            background-color: var(--color-dark-surface);
            color: var(--color-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .admin-login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            flex-grow: 1;
        }

        .admin-login-card {
            background: var(--color-white);
            color: var(--color-dark-main);
            border-radius: 24px;
            border: var(--glass-border);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
            position: relative;
        }

        .admin-login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            background: var(--color-off-white);
            padding: 10px;
            border: 2px solid var(--color-soft-pink);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .admin-card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--color-dark-main);
            margin-bottom: 6px;
        }

        .admin-card-subtitle {
            font-size: 0.875rem;
            color: var(--color-purple-gray);
            margin-bottom: 28px;
        }

        .admin-form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .admin-form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-dark-main);
            margin-bottom: 6px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-purple-gray);
            font-size: 1rem;
        }

        .admin-form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 10px;
            border: 1px solid var(--color-border-light);
            background: var(--color-off-white);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition-fast);
        }

        .admin-form-input:focus {
            border-color: var(--color-lime-green);
            background: var(--color-white);
            box-shadow: 0 0 0 3px rgba(168, 194, 61, 0.2);
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-purple-gray);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .password-toggle-btn:hover {
            color: var(--color-dark-main);
        }

        .btn-admin-login {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            background: var(--color-dark-main);
            color: var(--color-bright-yellow);
            font-size: 1rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all var(--transition-fast);
            margin-top: 10px;
        }

        .btn-admin-login:hover {
            background: var(--color-purple-gray);
            color: var(--color-white);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .login-error-alert {
            display: none;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #dc3545;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: left;
        }

        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-purple-gray);
            margin-top: 20px;
            transition: color var(--transition-fast);
        }

        .back-home-link:hover {
            color: var(--color-dark-main);
        }

        .admin-footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--color-purple-gray);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Header Mini Bar -->
    <header style="padding: 16px 24px;">
        <a href="index.html" class="back-home-link" style="color: var(--color-white);">
            <i class="fa-solid fa-arrow-left"></i> Return to Main Website
        </a>
    </header>

    <!-- Login Container -->
    <main class="admin-login-wrapper">
        <div class="admin-login-card">
            
            <div class="admin-login-logo">
                <img src="images/logo.png" alt="Shah Jee Logo">
            </div>

            <h1 class="admin-card-title">Admin Portal</h1>
            <p class="admin-card-subtitle">Sign in to manage inventory & product listings</p>

            <!-- Error Notification Alert -->
            <div class="login-error-alert" id="login-error">
                <i class="fa-solid fa-circle-exclamation"></i> Invalid username or password. Please try again.
            </div>

            <!-- Form -->
            <form id="admin-login-form">
                <div class="admin-form-group">
                    <label for="username" class="admin-form-label">Username / Email</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" class="admin-form-input" placeholder="admin" required autocomplete="username">
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="password" class="admin-form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="admin-form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle Password Visibility">
                            <i class="fa-solid fa-eye" id="toggle-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-admin-login" id="btn-login">
                    <span>Sign In to Dashboard</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <a href="index.html" class="back-home-link">
                <i class="fa-solid fa-house"></i> Back to Homepage
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="admin-footer">
        &copy; 2026 Shah Jee Laptops Supplier / Khurramjan. All Rights Reserved.
    </footer>

    <!-- Login Logic JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('admin-login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginError = document.getElementById('login-error');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleEye = document.getElementById('toggle-eye');

            // Auto-redirect if already logged in
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'admin_dashboard.html';
                return;
            }

            // Password Reveal Toggle
            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    toggleEye.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                });
            }

            // Handle Login Form Submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                try {
                    // 1. Try Backend Authentication if server is running
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminToken', data.token || 'authenticated');
                        window.location.href = 'admin_dashboard.html';
                        return;
                    }
                } catch (err) {
                    console.log('Backend authentication endpoint not active. Using client-side fallback check.');
                }

                // 2. Fallback Credentials Check (Demo Mode)
                if ((username === 'admin' || username === 'khurramjan@gmail.com') && password === 'admin123') {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminToken', 'fallback_token_123');
                    window.location.href = 'admin_dashboard.html';
                } else {
                    loginError.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
